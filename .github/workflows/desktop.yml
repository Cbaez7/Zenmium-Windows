name: desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      - "docs/zenmium/**"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      - "docs/zenmium/**"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Scan repository for secrets
        run: node scripts/scan-secrets.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Scan built application text
        run: node scripts/scan-secrets.mjs out

  windows-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Scan repository for secrets
        run: node scripts/scan-secrets.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Package Windows installer
        run: pnpm package:win --x64
      - name: Scan packaged application text
        run: |
          node scripts/extract-asar-for-scan.mjs dist/win-unpacked/resources/app.asar dist/windows-scan
          node scripts/scan-secrets.mjs dist/windows-scan
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Zenmium-Windows-x64
          path: desktop/dist/*.exe
          if-no-files-found: error
